<!-- dashboard.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Puzzle Royale</title>
    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #121212;
            color: #f5f5f5;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }
        .logo {
            font-size: 2rem;
            margin-bottom: 2rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .logo img {
            height: 50px;
        }
        .profile-info {
            margin-top: 1rem;
            text-align: center;
        }
        .profile-info img {
            border-radius: 50%;
            height: 100px;
            width: 100px;
        }
        button {
            padding: 0.75rem;
            border: none;
            border-radius: 8px;
            background: #bb86fc;
            color: #121212;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="logo">
        <img src="/static/logo.png" alt="Puzzle Royale Logo">
        <span>Puzzle Royale</span>
    </div>
    <h1>Welcome, {{ user['name'] }}</h1>
    <div class="profile-info">
        <img src="/static/uploads/{{ user['profile_photo'] }}" alt="Profile Photo">
        <p>Level: {{ user['level'] }}</p>
        <p>User ID: {{ user['user_id'] }}</p>
    </div>
    <button onclick="location.href='/play'">Play Game</button>
</body>
</html>
