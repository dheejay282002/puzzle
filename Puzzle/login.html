<!-- login.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Puzzle Royale</title>
    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #121212;
            color: #f5f5f5;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }
        .logo {
            font-size: 2rem;
            margin-bottom: 2rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .logo img {
            height: 50px;
        }
        form {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            width: 300px;
        }
        input, button {
            padding: 0.75rem;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
        }
        button {
            background: #bb86fc;
            color: #121212;
            cursor: pointer;
        }
        a {
            color: #bb86fc;
            text-decoration: none;
            margin-top: 1rem;
        }
        label {
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <div class="logo">
        <img src="/static/logo.png" alt="Puzzle Royale Logo">
        <span>Puzzle Royale</span>
    </div>
    <h1>Login</h1>
    <form method="POST">
        <input type="text" name="username" placeholder="Username" required>
        <input type="password" name="password" placeholder="Password" required>
        <button type="submit">Login</button>
    </form>
    <a href="/register">Don't have an account? Register</a>
</body>
</html>
